services:
  - type: web
    name: lugano-crm-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ADMIN_API_KEY_ENABLED
        value: "false"
      - key: ALLOWED_METHODS
        value: GET,POST,PATCH,DELETE,OPTIONS
      - key: ALLOWED_HEADERS
        value: Authorization,Content-Type,X-Admin-Key
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_TRUST_PROXY_HEADERS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DELIVERY_BASE_FEE
        value: "500"
      - key: DELIVERY_FREE_THRESHOLD
        value: "5000"
      - key: POINTS_PER_REAL
        value: "10"
      - key: PAYMENT_PROVIDER
        value: pix_static
      - key: PIX_KEY
        sync: false
      - key: PIX_MERCHANT_NAME
        sync: false
      - key: PIX_MERCHANT_CITY
        sync: false
      - key: PIX_TXID_PREFIX
        value: LUG
      - key: PIX_EXPIRES_MINUTES
        value: "30"
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      - key: NOTIFICATION_EMAIL_ENABLED
        value: "false"
      - key: NOTIFICATION_WHATSAPP_ENABLED
        value: "false"
      - key: NOTIFICATION_EMAIL_WEBHOOK_URL
        sync: false
      - key: NOTIFICATION_EMAIL_WEBHOOK_TOKEN
        sync: false
      - key: NOTIFICATION_WHATSAPP_WEBHOOK_URL
        sync: false
      - key: NOTIFICATION_WHATSAPP_WEBHOOK_TOKEN
        sync: false
      - key: NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS
        value: "5"
      - key: HEALTHCHECK_SUPABASE_ENABLED
        value: "true"
      - key: MONITORING_ALERTS_ENABLED
        value: "false"
      - key: MONITORING_WEBHOOK_URL
        sync: false
      - key: MONITORING_WEBHOOK_TOKEN
        sync: false
      - key: MONITORING_WEBHOOK_TIMEOUT_SECONDS
        value: "5"
      - key: MONITORING_SERVICE_NAME
        value: lugano-crm
      - key: MONITORING_HEALTH_PATH
        value: /health/ready
      - key: MONITORING_ENVIRONMENT
        value: production
