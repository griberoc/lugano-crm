services:
  - type: web
    name: lugano-crm-api-staging
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: ADMIN_API_KEY_ENABLED
        value: "false"
      - key: ALLOWED_METHODS
        value: GET,POST,PATCH,DELETE,OPTIONS
      - key: ALLOWED_HEADERS
        value: Authorization,Content-Type,X-Admin-Key
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_REQUESTS
        value: "120"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: RATE_LIMIT_TRUST_PROXY_HEADERS
        value: "false"
      - key: NOTIFICATIONS_ENABLED
        value: "true"
      - key: NOTIFICATION_EMAIL_ENABLED
        value: "false"
      - key: NOTIFICATION_WHATSAPP_ENABLED
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DELIVERY_BASE_FEE
        value: "500"
      - key: DELIVERY_FREE_THRESHOLD
        value: "5000"
      - key: POINTS_PER_REAL
        value: "10"
